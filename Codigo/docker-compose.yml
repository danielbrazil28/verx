services:
  postgres-lancamentos:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lancamentos
      POSTGRES_USER: lancamentos
      POSTGRES_PASSWORD: lancamentos
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lancamentos"]
      interval: 5s
      retries: 10

  postgres-consolidado:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: consolidado
      POSTGRES_USER: consolidado
      POSTGRES_PASSWORD: consolidado
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consolidado"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  lancamentos:
    build: ./lancamentos-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres-lancamentos:5432/lancamentos
      RABBIT_HOST: rabbitmq
    ports: ["8081:8081"]
    depends_on:
      postgres-lancamentos: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  consolidado:
    build: ./consolidado-service
    environment:
      DB_URL: jdbc:postgresql://postgres-consolidado:5432/consolidado
      RABBIT_HOST: rabbitmq
      REDIS_HOST: redis
    ports: ["8082:8082"]
    depends_on:
      postgres-consolidado: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_started }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports: ["3000:3000"]
